name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Backend Checks & Smoke Tests
      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Run Backend API Smoke Tests
        env:
          PORT: 5000
          NODE_ENV: development
          MONGO_URI: mongodb://localhost:27017/expense_tracker_ci
          JWT_SECRET: ci_test_secret_key_12345
        run: npm test --prefix server

      # Frontend Build & Verification
      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Build Frontend Application (Production Vite Bundle)
        run: npm run build --prefix client

      - name: Verify Build Artifacts
        run: |
          test -f client/dist/index.html && echo "Frontend production bundle verified successfully!"

  deploy-preview:
    name: Deployment Readiness Check
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Check Cloud Deployment Manifests
        run: |
          test -f render.yaml && echo "Render manifest verified."
          test -f client/vercel.json && echo "Vercel manifest verified."
          echo "Automated CI/CD pipeline passed: ready for automatic deploy to Vercel and Render."
