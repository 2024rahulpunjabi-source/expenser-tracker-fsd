services:
  # Backend Web Service
  - type: web
    name: expense-tracker-backend
    env: node
    plan: free
    buildCommand: npm ci --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
