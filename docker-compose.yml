version: '3.8'

services:
  # Database Service
  mongo:
    image: mongo:7.0
    container_name: expense_tracker_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=expense_tracker
    volumes:
      - mongo-data:/data/db
    networks:
      - expense-network

  # Backend REST API + WebSockets
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: expense_tracker_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/expense_tracker
      - JWT_SECRET=super_secret_jwt_key_expense_tracker_2026_dev_college_proj
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo
    networks:
      - expense-network

  # Frontend React Client
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: expense_tracker_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - expense-network

volumes:
  mongo-data:
    driver: local

networks:
  expense-network:
    driver: bridge
